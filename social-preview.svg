<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Vantá Cafe Order Assistant preview image">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbffe8"/>
      <stop offset="100%" stop-color="#f8ffd9"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#91c727"/>
      <stop offset="100%" stop-color="#f7e24e"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="80" y="80" width="1040" height="470" rx="40" fill="#ffffff" stroke="#dceaa8" stroke-width="4"/>
  <rect x="120" y="120" width="960" height="130" rx="28" fill="url(#card)"/>
  <text x="170" y="200" fill="#ffffff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="58" font-weight="800">☕ Vantá Cafe</text>
  <text x="170" y="260" fill="#2f4314" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="40" font-weight="700">Worker order assistant</text>
  <rect x="140" y="300" width="430" height="200" rx="24" fill="#f4ffd5" stroke="#c8ee63"/>
  <text x="170" y="355" fill="#41690e" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="30" font-weight="700">Quick presets</text>
  <text x="170" y="395" fill="#6f7d45" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24">• Greeting</text>
  <text x="170" y="430" fill="#6f7d45" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24">• Order updates</text>
  <text x="170" y="465" fill="#6f7d45" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24">• Finished message</text>
  <rect x="620" y="300" width="440" height="200" rx="24" fill="#fff7c7" stroke="#dceaa8"/>
  <text x="650" y="355" fill="#41690e" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="30" font-weight="700">Built-in drink recipes</text>
  <text x="650" y="395" fill="#6f7d45" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24">Coffee, slushies, sodas, tea</text>
  <text x="650" y="430" fill="#6f7d45" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24">Step-by-step making mode</text>
</svg>
